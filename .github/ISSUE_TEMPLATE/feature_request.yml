name: Idea
description: Un'app dove non funziona, una regola che manca, un modo migliore di suggerire. An app where it doesn't work, a missing rule, a better way to suggest.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: L'idea / The idea
      description: Cosa vorresti e perché ti servirebbe. What you'd like and why it would help.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: App, macOS, Mac
      description: Compilato dall'app. Filled in by the app.
